---
# Second Nautobot stack playing the hub role next to the default stack, which plays a spoke.
#
# Start it with `invoke -f invoke.hub.yml start` (and stop/destroy/logs/nbshell it the same way). It runs its own
# PostgreSQL, Redis, Nautobot, worker and beat under the compose project `nautobot-ssot-mongo-hub`, shares the
# MongoDB of the default stack by joining that stack's network, and publishes Nautobot on http://localhost:8081.
# The docs service is not started for this stack.
x-hub: &hub
  environment:
    - "NAUTOBOT_SSOT_MONGO_ROLE=HUB"
    - "NAUTOBOT_SSOT_MONGO_INSTANCE=HUB"
    - "NAUTOBOT_SSOT_MONGO_URI=mongodb://mongo:27017/"
    - "NAUTOBOT_BANNER_TOP=HUB"
  networks:
    - "default"
    - "spoke_stack"

services:
  nautobot:
    <<: *hub
    ports: !override
      - "8081:8080"
  worker:
    <<: *hub
  beat:
    <<: *hub
  docs:
    profiles:
      - "docs"

networks:
  # Network of the default stack, where the shared `mongo` service lives. Start the default stack first.
  spoke_stack:
    name: "nautobot-ssot-mongo_default"
    external: true
